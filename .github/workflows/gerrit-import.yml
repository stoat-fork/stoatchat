name: "Gerrit: Import PR"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed]
    branches: [main, "release/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gerrit-import-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GERRIT_HOST: gerrit.stoatinternal.com
  GERRIT_PROJECT: stoatchat
  GERRIT_USER: stoat-gerrit-bot
  GERRIT_BOT_NAME: Stoat Gerrit Bot
  GERRIT_BOT_EMAIL: gerrit-bot@stoat.chat

jobs:
  gerrit-change:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.change.outputs.id }}
      rest-id: ${{ steps.change.outputs.rest-id }}
    steps:
      - name: Derive Gerrit change from PR
        id: change
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          change_id="I$(printf '%s' "$PR_URL" | sha1sum | cut -c1-40)"
          echo "id=$change_id" >> "$GITHUB_OUTPUT"
          echo "rest-id=$GERRIT_PROJECT~$(jq -rn --arg branch "$BASE" '$branch | @uri')~$change_id" >> "$GITHUB_OUTPUT"

  import:
    needs: gerrit-change
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'open'
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR commits
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch -q --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr"

      - name: Squash PR into a single commit
        id: squash
        env:
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          CHANGE_ID: ${{ needs.gerrit-change.outputs.id }}
        run: |
          set -euo pipefail

          merge_base=$(git merge-base HEAD refs/remotes/pr)
          pr_head=$(git rev-parse refs/remotes/pr)
          pr_commits="$merge_base..$pr_head"
          read -r first_commit < <(git rev-list --reverse "$pr_commits")
          primary_author_email=$(git show -s --format=%ae "$first_commit")

          trailers=(--if-exists addIfDifferent)
          while read -r co_author; do
            trailers+=(--trailer "Co-authored-by: $co_author")
          done < <(git log --reverse --format='%ae%x09%an <%ae>' "$pr_commits" \
            | awk -F '\t' -v primary="$primary_author_email" '$1 != primary && !seen[$1]++ { print $2 }')
          while read -r signoff; do
            trailers+=(--trailer "Signed-off-by: $signoff")
          done < <(git log --reverse --format='%(trailers:key=Signed-off-by,valueonly)' "$pr_commits" | sed '/^$/d')
          trailers+=(--if-exists replace --trailer "GitHub-Pull-Request: $PR_URL" --trailer "Change-Id: $CHANGE_ID")

          printf '%s (#%s)\n\n%s\n' "$TITLE" "$PR" "$BODY" | tr -d '\r' | git stripspace \
            | git interpret-trailers "${trailers[@]}" > "$RUNNER_TEMP/commit-message"

          squashed_commit=$(
            GIT_AUTHOR_NAME=$(git show -s --format=%an "$first_commit") \
            GIT_AUTHOR_EMAIL=$(git show -s --format=%ae "$first_commit") \
            GIT_AUTHOR_DATE=$(git show -s --format=%aI "$pr_head") \
            GIT_COMMITTER_NAME="$GERRIT_BOT_NAME" \
            GIT_COMMITTER_EMAIL="$GERRIT_BOT_EMAIL" \
            GIT_COMMITTER_DATE=$(git show -s --format=%cI "$pr_head") \
            git commit-tree "$pr_head^{tree}" -p "$merge_base" -F "$RUNNER_TEMP/commit-message"
          )

          git show -s "$squashed_commit"
          echo "commit=$squashed_commit" >> "$GITHUB_OUTPUT"

      - name: Restore abandoned Gerrit change
        if: github.event.action == 'reopened'
        env:
          CHANGE: ${{ needs.gerrit-change.outputs.rest-id }}
          HTTP_PASSWORD: ${{ secrets.GERRIT_BOT_HTTP_PASSWORD }}
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/restore.log" -w '%{http_code}' -u "$GERRIT_USER:$HTTP_PASSWORD" \
            -H 'Content-Type: application/json' -d '{"message": "Pull request reopened on GitHub"}' \
            "https://$GERRIT_HOST/a/changes/$CHANGE/restore")
          case "$status" in
            200) echo "Restored $CHANGE" ;;
            404|409) echo "Nothing to restore: $(cat "$RUNNER_TEMP/restore.log")" ;;
            *) cat "$RUNNER_TEMP/restore.log"; exit 1 ;;
          esac

      - name: Configure Gerrit credentials
        env:
          HTTP_PASSWORD: ${{ secrets.GERRIT_BOT_HTTP_PASSWORD }}
        run: |
          basic_auth=$(printf '%s:%s' "$GERRIT_USER" "$HTTP_PASSWORD" | base64 -w0)
          echo "::add-mask::$basic_auth"
          git config "http.https://$GERRIT_HOST/.extraHeader" "Authorization: Basic $basic_auth"

      - name: Push to Gerrit for review
        id: push
        env:
          COMMIT: ${{ steps.squash.outputs.commit }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          if git push "https://$GERRIT_HOST/a/$GERRIT_PROJECT" \
               "$COMMIT:refs/for/$BASE%hashtag=github-pr,m=Updated_from_GitHub" 2>&1 | tee "$RUNNER_TEMP/push.log" \
             || grep -q 'no new changes' "$RUNNER_TEMP/push.log"; then
            exit 0
          fi
          echo "rejection=$(sed -n 's/.*\[remote rejected\][^(]*(\(.*\))$/\1/p; T; q' "$RUNNER_TEMP/push.log")" >> "$GITHUB_OUTPUT"
          exit 1

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.push.outcome == 'success'
        with:
          header: gerrit-import
          skip_unchanged: true
          message: |
            https://${{ env.GERRIT_HOST }}/q/${{ needs.gerrit-change.outputs.id }}

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: failure() && steps.push.outcome == 'failure'
        with:
          header: gerrit-import
          skip_unchanged: true
          message: |
            Gerrit rejected this PR:

            ```
            ${{ steps.push.outputs.rejection || 'unknown error, see the workflow logs' }}
            ```

  abandon:
    needs: gerrit-change
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Abandon Gerrit change
        env:
          CHANGE: ${{ needs.gerrit-change.outputs.rest-id }}
          HTTP_PASSWORD: ${{ secrets.GERRIT_BOT_HTTP_PASSWORD }}
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/abandon.log" -w '%{http_code}' -u "$GERRIT_USER:$HTTP_PASSWORD" \
            -H 'Content-Type: application/json' -d '{"message": "Pull request closed on GitHub"}' \
            "https://$GERRIT_HOST/a/changes/$CHANGE/abandon")
          case "$status" in
            200) echo "Abandoned $CHANGE" ;;
            404|409) echo "Nothing to abandon: $(cat "$RUNNER_TEMP/abandon.log")" ;;
            *) cat "$RUNNER_TEMP/abandon.log"; exit 1 ;;
          esac
