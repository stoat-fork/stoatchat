name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.GH_STOAT_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_STOAT_RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          prerelease=false
          if [[ "$TAG" =~ -rc\.[0-9]+$ ]]; then
            prerelease=true
          fi

          git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
          {
            if $prerelease; then
              printf '> [!WARNING]\n> This is a release candidate and the code changelog below is not necessarily complete or accurate.\n\n'
            fi
            git tag -l --format='%(contents:body)' "$TAG"
          } > "$RUNNER_TEMP/notes.md"
          newest=$(git -c versionsort.suffix=-rc tag --list 'v*' --sort=-v:refname | grep -v -- '-rc\.' | head -n1)

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease="$prerelease" \
            --latest="$([[ "$TAG" == "$newest" ]] && echo true || echo false)"
