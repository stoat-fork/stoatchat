name: "Gerrit: Close merged PRs"

on:
  push:
    branches: [main, "release/**"]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    if: ${{ !github.event.created }}
    steps:
      - name: Close PRs referenced by pushed commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          jq -c '.commits[] | {id, message}' "$GITHUB_EVENT_PATH" | while read -r commit; do
            merged_sha=$(jq -r .id <<<"$commit")
            pr_url=$(jq -r .message <<<"$commit" | git interpret-trailers --parse | sed -n 's/^GitHub-Pull-Request: //p' | tail -n1)

            [[ "$pr_url" == "https://github.com/$GITHUB_REPOSITORY/pull/"* ]] || continue
            [ "$(gh pr view "$pr_url" --json state -q .state)" = OPEN ] || continue

            gh pr close "$pr_url" --comment "Merged in Gerrit as $merged_sha on \`$GITHUB_REF_NAME\`, thanks for your contribution!"
          done
